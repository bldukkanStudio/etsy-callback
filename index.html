<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLDukkanStudio – Etsy yetki kodu</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  textarea { width: 100%; font-family: monospace; font-size: 14px; }
  button { margin-top: 8px; padding: 8px 14px; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h2>Etsy yetkilendirme kodu</h2>
<p>Bu sayfa hiçbir bilgiyi sunucuya göndermez. Aşağıdaki değerleri kopyalayıp BLDukkanStudio panelindeki alana yapıştırın.</p>
<div id="content"></div>
<script>
  // Etsy, yetki sonrası bu sayfayı ?code=...&state=... parametreleriyle açar.
  // Değerler yalnızca bu tarayıcıda gösterilir; ağ isteği yapılmaz.
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var state = params.get("state");
  var error = params.get("error_description") || params.get("error");
  var root = document.getElementById("content");

  function box(label, value) {
    var wrap = document.createElement("div");
    var lab = document.createElement("p");
    lab.textContent = label;
    var ta = document.createElement("textarea");
    ta.rows = 2;
    ta.readOnly = true;
    ta.value = value;
    var btn = document.createElement("button");
    btn.textContent = "Kopyala";
    btn.onclick = function () { ta.select(); navigator.clipboard.writeText(value); btn.textContent = "Kopyalandı"; };
    wrap.appendChild(lab); wrap.appendChild(ta); wrap.appendChild(btn);
    root.appendChild(wrap);
  }

  if (error) {
    var p = document.createElement("p");
    p.className = "err";
    p.textContent = "Etsy yetkiyi reddetti veya bir hata oluştu: " + error;
    root.appendChild(p);
  } else if (code && state) {
    box("Kod (code):", code);
    box("State:", state);
  } else {
    var p2 = document.createElement("p");
    p2.textContent = "Bu sayfa Etsy yetkilendirmesinden sonra açılmalıdır. Panelden 'Etsy ile bağlan' ile başlayın.";
    root.appendChild(p2);
  }
</script>
